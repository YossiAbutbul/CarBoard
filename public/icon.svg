<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#14284a" />
      <stop offset="0.55" stop-color="#0b1628" />
      <stop offset="1" stop-color="#060d19" />
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#2f7cf0" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2f7cf0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b8cff" />
      <stop offset="1" stop-color="#9fd0ff" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />

  <!-- dial: a 270° track, centred on 256,276 with radius 150 -->
  <g transform="translate(256 276)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="22" stroke-linecap="round"
      stroke-dasharray="706.9 942.5" transform="rotate(135)" />
    <!-- progress, with a glow under it -->
    <circle r="150" fill="none" stroke="#3b8cff" stroke-width="22" stroke-linecap="round" filter="url(#soft)" opacity="0.8"
      stroke-dasharray="471 942.5" transform="rotate(135)" />
    <circle r="150" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"
      stroke-dasharray="471 942.5" transform="rotate(135)" />
    <!-- ticks -->
    <g stroke="#ffffff" stroke-linecap="round">
      <line y1="-104" y2="-118" stroke-width="7" stroke-opacity="0.85" transform="rotate(-135)" />
      <line y1="-104" y2="-118" stroke-width="7" stroke-opacity="0.85" transform="rotate(-67.5)" />
      <line y1="-104" y2="-118" stroke-width="7" stroke-opacity="0.85" />
      <line y1="-104" y2="-118" stroke-width="7" stroke-opacity="0.85" transform="rotate(67.5)" />
      <line y1="-104" y2="-118" stroke-width="7" stroke-opacity="0.85" transform="rotate(135)" />
    </g>
    <!-- needle, pointing at the end of the progress arc -->
    <g transform="rotate(45)">
      <path d="M -9 6 L 0 -112 L 9 6 Z" fill="#ffffff" />
    </g>
    <circle r="24" fill="#ffffff" />
    <circle r="10" fill="#0b1628" />
  </g>
</svg>
