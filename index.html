<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1626" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700;800;900&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet" />
    <title>CarBoard</title>
    <meta name="description" content="כל הרכב במקום אחד: טסט, ביטוח, טיפולים וק״מ, עם תזכורת בזמן." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarBoard" />
    <meta property="og:title" content="CarBoard · כל הרכב. במקום אחד." />
    <meta property="og:description" content="טסט, ביטוח, טיפולים וק״מ, עם תזכורת בזמן." />
    <meta property="og:url" content="https://carboard-teal.vercel.app/" />
    <meta property="og:image" content="https://carboard-teal.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://carboard-teal.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last resort: an error before the app is up would leave a blank page. Show a friendly one
      // instead; the technical part only goes to the clipboard ("copy details").
      ;(function () {
        var shown = false
        function show(msg) {
          if (shown) return
          var root = document.getElementById('root')
          if (root && root.childElementCount) return
          shown = true
          var details = String(msg) + '\n' + location.href + '\n' + navigator.userAgent
          document.body.innerHTML =
            '<div style="min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:32px 22px max(28px,env(safe-area-inset-bottom));background:#08111f;color:#fff;font-family:\'Noto Sans Hebrew\',system-ui,sans-serif;direction:rtl">' +
            '<b style="font-size:38px;line-height:1.1">משהו השתבש</b>' +
            '<p style="margin:0;font-size:15px;line-height:1.5;color:rgba(255,255,255,.62)">הנתונים שלכם שמורים. טעינה מחדש בדרך כלל פותרת את זה.</p>' +
            '<button id="cb-reload" style="margin-top:12px;height:54px;border-radius:16px;border:0;background:#fff;color:#0f1720;font:600 15.5px inherit">טעינה מחדש</button>' +
            '<button id="cb-copy" style="border:0;background:none;color:rgba(255,255,255,.5);font:500 12.5px inherit;text-decoration:underline;padding:6px">העתקת פרטים לתמיכה</button></div>'
          document.getElementById('cb-reload').onclick = function () { location.reload() }
          document.getElementById('cb-copy').onclick = function () {
            var b = this
            var done = function () { b.textContent = '✓ הפרטים הועתקו' }
            if (navigator.clipboard) navigator.clipboard.writeText(details).then(done)
          }
        }
        window.addEventListener('error', function (e) { show((e.error && e.error.stack) || e.message) })
        window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.stack) || e.reason) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
