<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1626" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700;800;900&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet" />
    <title>CarBoard</title>
    <meta name="description" content="כל הרכב במקום אחד: טסט, ביטוח, טיפולים וק״מ, עם תזכורת בזמן." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarBoard" />
    <meta property="og:title" content="CarBoard · כל הרכב. במקום אחד." />
    <meta property="og:description" content="טסט, ביטוח, טיפולים וק״מ, עם תזכורת בזמן." />
    <meta property="og:url" content="https://carboard-teal.vercel.app/" />
    <meta property="og:image" content="https://carboard-teal.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://carboard-teal.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last resort: an error before the app is up would leave a blank page; print it instead.
      ;(function () {
        var shown = false
        function show(msg) {
          if (shown) return
          var root = document.getElementById('root')
          if (root && root.childElementCount) return
          shown = true
          document.body.innerHTML =
            '<div style="font:14px system-ui;padding:24px;text-align:center;direction:rtl">' +
            '<b style="font-size:18px">משהו השתבש</b><p>טעינה מחדש בדרך כלל פותרת את זה.</p>' +
            '<button onclick="location.reload()" style="padding:10px 22px;border-radius:12px;border:0;background:#1c69d4;color:#fff;font-size:15px">טעינה מחדש</button>' +
            '<pre dir="ltr" style="white-space:pre-wrap;word-break:break-word;text-align:left;font-size:11px;color:#7a8491;margin-top:16px"></pre></div>'
          document.querySelector('pre').textContent = String(msg)
        }
        window.addEventListener('error', function (e) { show((e.error && e.error.stack) || e.message) })
        window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.stack) || e.reason) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
